# Cấu hình Hermes đề xuất cho plugin Antigravity OAuth
# Sao chép nội dung này vào $HERMES_HOME/config.yaml (hoặc chạy `hermes config set`)

# Chuỗi fallback khi provider chính bị rate-limit:
#   Primary: Gemini (antigravity)
#   → ChatGPT (openai-codex)
#   → Gemini flash-medium (antigravity)
#   → Gemini flash (antigravity)
#   → Claude Sonnet (anthropic)
#   → GPT-5.6-sol (openai-codex)
fallback_providers:
  - model: gpt-5-codex
    provider: openai-codex
  - model: gemini-3.7-flash-medium
    provider: antigravity
  - model: gemini-3.7-flash
    provider: antigravity
  - model: claude-sonnet-4-6
    provider: anthropic
  - model: gpt-5.6-sol
    provider: openai-codex
    base_url: https://chatgpt.com/backend-api/codex
